  <!-- "P" monogram -->
  <path fill-rule="evenodd" d="M24 20 H34 a8 8 0 0 1 0 16 H30 V44 H24 Z M30 26 H34 a4 4 0 0 1 0 8 H30 Z" fill="#16151A"/>
</svg>
