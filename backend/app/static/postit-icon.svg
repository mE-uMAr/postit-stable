  <path d="M16 8 H48 a8 8 0 0 1 8 8 V40 L40 56 H16 a8 8 0 0 1 -8 -8 V16 a8 8 0 0 1 8 -8 Z" fill="#FFB627"/>
  <!-- Folded corner -->
