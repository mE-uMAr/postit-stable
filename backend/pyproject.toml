[project]
name = "postit-backend"
version = "1.0.0"
description = "Postit — async FastAPI backend (auth, posts, billing, analytics, admin)."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    # Data layer
    "SQLAlchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "aiomysql==0.2.0",
    # Validation / settings
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    # Security
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    # Infra clients
    "redis==5.2.1",
    "httpx==0.28.1",
    "orjson==3.10.13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# --- ADDED TO FIX BUILD ERROR ---
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
